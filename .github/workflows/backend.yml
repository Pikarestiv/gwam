name: Backend Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Namecheap (SSH/Rsync)
        uses: easingthemes/ssh-deploy@v5.0.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "backend/"
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          TARGET: "/home/${{ secrets.SSH_USER }}/api.gwam.dumostech.com"
          EXCLUDE: "/storage/, /vendor/, /.env, /node_modules/"

      - name: Run Post-Deploy Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/api.gwam.dumostech.com
            PHP_BIN=/opt/alt/php81/usr/bin/php
            if [ ! -x "$PHP_BIN" ]; then echo "PHP 8.1 CLI not found at $PHP_BIN - check installed alt-php versions" && exit 1; fi
            if [ ! -f "$HOME/bin/composer.phar" ]; then
              mkdir -p "$HOME/bin"
              curl -sS https://getcomposer.org/installer | "$PHP_BIN" -- --install-dir="$HOME/bin" --filename=composer.phar
            fi
            "$PHP_BIN" "$HOME/bin/composer.phar" install --no-dev --optimize-autoloader
            "$PHP_BIN" artisan migrate --force
            "$PHP_BIN" artisan config:cache
            "$PHP_BIN" artisan route:cache
            "$PHP_BIN" artisan view:cache
            "$PHP_BIN" artisan queue:restart
